    - prayer log
    - qada
    - qaza
  promise_regex_patterns:
    - "track(?:s|ing|er)?\\s+(?:your\\s+|my\\s+|daily\\s+)?(?:prayer|salah|namaz)"
    - "(?:missed|make[- ]?up)\\s+(?:prayer|salah|namaz)"

tracker_score:
