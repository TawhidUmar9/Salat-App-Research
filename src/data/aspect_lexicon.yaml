    - goals
    - challenge
    - target
    - milestone
    - event
    - badge
    - badges
    - reward
    - rewards
    - achievement
  regex_patterns:
    - "(?:daily|weekly|monthly)\\s+(?:goal|target|challenge)"
    - "(?:earn|unlock)\\s+(?:a\\s+)?(?:badge|reward|point)"
  # "goal"/"target" appear in generic motivational copy.
  promise_keywords:
    - badge
    - badges
    - achievement
    - streak
    - reward
  promise_regex_patterns:
    - "(?:daily|weekly|monthly)\\s+(?:goal|target|challenge)"
    - "(?:earn|unlock)\\s+\\w{0,10}\\s?(?:badge|reward|achievement)"

