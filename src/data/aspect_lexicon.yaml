    - subscription
    - subscribe
    - paid
    - free
    - paywall
    - purchase
    - expensive
    - price
    - pricing
    - trial
    - upgrade
    - pro version
    - money
    - refund
  regex_patterns:
    - "(?:have\\s+to|need\\s+to|must)\\s+(?:pay|purchase|subscribe|buy)"
    - "behind\\s+(?:a\\s+)?paywall"
    - "\\$\\d+|\\d+\\s*(?:usd|dollar|taka|tk|rupee|riyal)"
    - "(?:in[- ]app\\s+)?purchase"
    - "টাকা|ফ্রি"                 # Bengali: money / free

prayer_tracker:
