    - "(?:fajr|isha)\\s+angle"
    - "\\d+(?:\\.\\d+)?\\s*degree"
    - "calculation\\s+(?:method|setting|option)s?"

reminders_adhan:
  csv_column: "Timely Reminders"  # + Waqt relative reminders + Custom Reminder Sounds
  rqs: [RQ2, RQ6]
