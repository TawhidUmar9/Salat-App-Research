    - design
    - ui
    - ux
    - layout
    - beautiful
    - clean
    - ugly
    - theme
    - dark mode
    - night mode
    - easy to use
    - user friendly
    - intuitive
    - font
    - color
    - colour
    - aesthetic
  regex_patterns:
    - "(?:looks?|looking)\\s+(?:good|great|nice|beautiful|ugly|bad|clean|modern|outdated)"
    - "(?:user[- ]?friendly|easy\\s+to\\s+(?:use|navigate)|hard\\s+to\\s+(?:use|navigate))"
    - "(?:dark|night|light)\\s+mode"
    - "(?:nice|good|great|bad|poor|terrible)\\s+(?:ui|ux|design|interface|layout)"

