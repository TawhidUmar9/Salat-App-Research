# Aspect Taxonomy — Seed Keywords & Regex Patterns
# ==================================================
# Externalized so it is reviewable and citable in the paper.
#
# See implementation_plan.md §5.1, §5.2 for full specification.
#
# 20 CSV-linked aspects + 7 review-only aspects = 27 total
#
# Format per aspect:
#   aspect_name:
#     csv_column: <name from CSV or null>
#     rqs: [list of RQs this aspect serves]
#     keywords:
#       - keyword or phrase           # matched on word boundaries, case-insensitive
#     regex_patterns:
#       - regex pattern               # for transliterations and complex matches
#
# MATCHING SEMANTICS (see scripts/_common.py:compile_aspect_patterns):
#   * keywords are wrapped in \b...\b, so "ads" does not fire inside "adhan"
#   * internal spaces in a keyword become \s+ (tolerates "prayer  time")
#   * regex_patterns are inserted verbatim — write them defensively
#   * everything is combined into ONE alternation per aspect and applied to the
#     lowercased sentence
#
# NON-ENGLISH SURFACE FORMS: ~30-40% of the corpus is Bengali/Arabic/Urdu and is
# NOT machine-translated (see 02b's design note). Native-script patterns below
# are what let those reviews reach the aspect taxonomy at all.

# ─── CSV-linked aspects (§5.1) ──────────────────────────────────────────────────

prayer_times_accuracy:
  csv_column: "Prayer Times by Location"
  rqs: [RQ2, RQ6]
  keywords:
    - prayer time
    - namaz time
    - salah time
    - wrong time
    - accurate
    - inaccurate
    - fajr
    - fajar          # transliteration variant
    - dhuhr
    - zuhr           # transliteration variant
    - johor           # Bengali/Malay transliteration
    - asr
    - maghrib
    - magrib         # transliteration variant
    - isha
    - esha           # transliteration variant
    - minutes off
    - location
    - timezone
    - time zone
  regex_patterns:
    - "\\d+\\s*(?:min|minute|minutes|mins)\\s*(?:off|early|late|ahead|behind|difference)"
    - "(?:time|times)\\s+(?:is|are|was|were)\\s+(?:wrong|incorrect|off|inaccurate)"
    - "(?:wrong|incorrect|inaccurate)\\s+(?:prayer\\s+)?(?:time|times|timing)"
    - "নামাজের?\\s*সময়"          # Bengali: prayer time
    - "ওয়াক্ত"                   # Bengali: waqt / prayer period
    - "وقت\\s*الصلا"              # Arabic: prayer time

madhab:
  csv_column: "Madhab Variations"
  rqs: [RQ2]
  keywords:
    - hanafi
    - hanafee        # transliteration variant
    - shafi
    - shafii
    - maliki
    - hanbali
    - madhab
    - mazhab         # transliteration variant
    - mazhhab
    - madhhab
    - school of thought
    - asr time
  regex_patterns:
    - "asr\\s+(?:time\\s+)?(?:is\\s+)?(?:wrong|different|early|late)"
    - "মাযহাব|মাজহাব"             # Bengali: madhab
    - "হানাফী|হানাফি"             # Bengali: Hanafi
    - "مذهب"                      # Arabic: madhab

