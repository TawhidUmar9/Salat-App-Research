    - "(?:prayer|salah)\\s+(?:score|grade|percentage|statistic)"
    - "progress\\s+(?:chart|graph|report|bar)"

women_period:
  csv_column: "Women tracking"
  rqs: [RQ4]
  keywords:
    - period
    - periods
    - menstruation
    - menstrual
    - haid
    - haiz
    - hayd
    - nifas
    - cycle
    - women
    - woman
    - sister
    - sisters
    - exemption
    - exempt
    - exclude
    - female
  regex_patterns:
    - "(?:on\\s+(?:my\\s+)?|during\\s+(?:my\\s+)?)period"
    - "(?:menstrual|monthly)\\s+(?:cycle|period|days)"
    - "(?:can'?t|cannot|don'?t|do\\s+not)\\s+pray.{0,30}(?:period|menstruat|haid)"
    - "(?:exclude|skip|pause|exempt).{0,25}(?:period|menstruat|haid|cycle)"
    - "(?:for\\s+)?(?:women|woman|sisters|girls)\\s+(?:who|that|option|feature|setting)"
    - "হায়েজ|মাসিক"               # Bengali: menstruation
  # "women"/"sister" appear in generic audience copy ("for brothers and sisters").
  promise_keywords:
    - menstruation
    - menstrual
    - haid
    - haiz
    - nifas
    - period tracking
    - period tracker
  promise_regex_patterns:
    - "(?:women|woman|female)'?s?\\s+(?:health|cycle|mode|feature|tracking)"
    - "(?:exempt|exclude|skip|pause)\\w*\\s+\\w{0,12}\\s?(?:period|menstruat|haid)"

