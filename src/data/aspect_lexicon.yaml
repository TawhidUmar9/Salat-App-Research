companion_hardware:
  csv_column: "Has Companion Hardware"
  rqs: [RQ5]
  keywords:
    - ring
    - smart ring
    - watch
    - smartwatch
    - smart watch
    - wearable
    - device
    - band
    - pair
    - pairing
    - bluetooth
    - wear os
    - galaxy watch
    - apple watch
    - zikr ring
    - tasbih ring
  regex_patterns:
    - "(?:smart\\s*)?(?:watch|ring|band).{0,25}(?:pair|connect|sync|support)"
    - "(?:wear\\s*os|watchos|galaxy\\s+watch|apple\\s+watch|fitbit)"
    - "(?:zikr|tasbih|tasbeeh)\\s+ring"

# ─── Review-only aspects (§5.2) ─────────────────────────────────────────────────
# No CSV column, but essential to the RQs. complexity_bloat and spiritual_affect
# are the two the revised RQs require and v1 lacked — RQ5's bloat construct and
# RQ1's love/hate tension are otherwise unmeasurable.
  # "device" and "watch" appear in generic copy ("on any device", "watch videos").
  promise_keywords:
    - smartwatch
    - smart watch
    - wear os
    - watchos
    - apple watch
    - galaxy watch
    - wearable
    - smart ring
    - zikr ring
    - tasbih ring
  promise_regex_patterns:
    - "(?:companion|paired)\\s+(?:device|watch|ring|band)"

