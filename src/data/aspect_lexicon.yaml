  keywords:
    - crash
    - crashes
    - crashing
    - bug
    - bugs
    - buggy
    - freeze
    - freezes
    - frozen
    - force close
    - slow
    - lag
    - laggy
    - battery
    - drain
    - not working
    - broken
    - glitch
    - error
    - hang
  regex_patterns:
    - "(?:keeps?|always|constantly)\\s+(?:crash|crashing|closing|freezing|stopping)"
    - "(?:force\\s+close|stopped\\s+working|not\\s+responding|won'?t\\s+open)"
    - "battery\\s+(?:drain|draining|usage|consumption)"
    - "(?:after|since)\\s+(?:the\\s+)?(?:update|upgrade).{0,30}(?:not\\s+work|broken|crash|bug)"

ads_intrusive:
  csv_column: null
  rqs: [RQ5, RQ6]
  keywords:
    - ad
    - ads
    - advert
    - adverts
    - advertisement
    - advertisements
    - advertising
    - popup
    - pop up
    - pop-up
    - banner
    - commercial
  regex_patterns:
    - "(?:too\\s+many|so\\s+many|lots?\\s+of|full\\s+of|filled\\s+with)\\s+ads?"
    - "(?:full[- ]?screen|pop[- ]?up|video)\\s+ads?"
    - "ads?\\s+(?:everywhere|every\\s+time|annoying|intrusive|constantly)"
    - "বিজ্ঞাপন"                   # Bengali: advertisement

privacy_data:
  csv_column: null
  rqs: [RQ4]
  keywords:
    - privacy
    - private
    - data
    - permission
    - permissions
    - spyware
    - surveillance
    - gdpr
    - location access
    - sold
    - selling
    - third party
    - security
  # NOTE: bare "tracking" is deliberately NOT a keyword here. It collides with
  # prayer tracking and period tracking ("doesn't have women period tracking"
  # matched privacy_data before this was tightened). Surveillance-sense tracking
  # is captured by the context-requiring patterns below.
  regex_patterns:
    - "track(?:s|ing|ed)?\\s+(?:me|us|my|our|your|user)"
    - "(?:being|getting)\\s+track(?:ed|ing)"
    - "(?:location|gps|activity|behaviou?r)\\s+track(?:ing|er)"
    - "(?:sold|selling|sells|shared|sharing)\\s+(?:my\\s+|our\\s+|user\\s+)?data"
    - "(?:data|privacy)\\s+(?:breach|leak|concern|policy|issue|scandal)"
    - "(?:why|what)\\s+(?:does\\s+it|do\\s+they)\\s+need.{0,30}permission"
    - "(?:location|contact|camera|microphone)\\s+(?:access|permission)"
    - "military|army|us\\s+government"

