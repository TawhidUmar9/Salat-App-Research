guides:
  csv_column: "Salah and/or Wudu Guides"
  rqs: [RQ6]
  keywords:
    - how to pray
    - wudu
    - wudhu
    - ozu             # Bengali transliteration
    - ablution
    - guide
    - tutorial
    - learn salah
    - learn to pray
    - step by step
    - instruction
  regex_patterns:
    - "how\\s+to\\s+(?:pray|perform|do)\\s+(?:salah|namaz|wudu|prayer)"
    - "(?:teach|teaches|teaching|learn|learning)\\s+(?:me\\s+)?(?:to\\s+)?(?:pray|salah|namaz)"
    - "অজু|ওযু"                   # Bengali: wudu
  # bare "guide"/"learn" is ubiquitous marketing filler.
  promise_keywords:
    - wudu guide
    - wudhu guide
    - salah guide
    - prayer guide
    - ablution
  promise_regex_patterns:
    - "(?:how\\s+to|learn\\s+to|teaches?\\s+you\\s+to)\\s+(?:pray|perform\\s+(?:salah|wudu))"
    - "step[- ]by[- ]step\\s+\\w{0,12}\\s?(?:prayer|salah|wudu|guide)"

adhkar:
  csv_column: "Salah Specific Adhkars"
  rqs: [RQ6]
  keywords:
    - dhikr
    - zikr           # transliteration variant
    - zikir
    - adhkar
    - azkar
    - tasbih
    - tasbeeh
    - dua
    - duas
    - supplication
    - morning evening
    - istighfar
  regex_patterns:
    - "(?:morning|evening)\\s+(?:adhkar|azkar|dhikr|dua)"
    - "দোয়া|জিকির"                # Bengali: dua / dhikr
    - "أذكار|دعاء"                # Arabic: adhkar / dua
  # "dua" appears in nearly every Islamic app's copy as generic content;
  # require an explicit adhkar/tasbih offering.
  promise_keywords:
    - adhkar
    - azkar
    - tasbih
    - tasbeeh
    - dhikr counter
    - zikr counter
    - digital tasbih
  promise_regex_patterns:
    - "(?:morning|evening)\\s+(?:adhkar|azkar|dhikr)"
    - "(?:dua|supplication)\\s+(?:library|collection|book)"

qibla:
  csv_column: "Qibla Compass"
  rqs: [RQ2]
  keywords:
