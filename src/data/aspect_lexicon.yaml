  regex_patterns:
    - "forbidden\\s+(?:time|hour|period)s?"
    - "(?:can'?t|cannot|should\\s+not)\\s+pray\\s+(?:at|during)"
    - "নিষিদ্ধ\\s*সময়"            # Bengali: forbidden time

nafl_times:
