    - qiblah
    - kiblah         # transliteration variant
    - quibla
    - compass
    - direction
    - kaaba
    - kabah
    - mecca
    - makkah
    - calibrate
    - calibration
  regex_patterns:
    - "qibla.{0,25}(?:wrong|off|incorrect|not\\s+accurate|inaccurate|spinning)"
    - "compass.{0,25}(?:wrong|off|not\\s+working|spinning|inaccurate)"
    - "pointing\\s+(?:the\\s+)?wrong\\s+(?:way|direction)"
    - "কিবলা|ক্বিবলা"              # Bengali: qibla
    - "قبلة"                      # Arabic: qibla

table_format:
  csv_column: "Prayer times in Table format"
  rqs: [RQ6b]
  keywords:
    - table
    - monthly
    - calendar view
    - timetable
    - time table
    - schedule
    - pdf
    - printable
    - chart
  regex_patterns:
    - "(?:monthly|yearly|weekly)\\s+(?:time\\s*table|schedule|calendar|chart)"
    - "(?:print|download|save|export)\\s+(?:the\\s+)?(?:time\\s*table|schedule|pdf)"
    - "সময়সূচি|রুটিন"             # Bengali: schedule / routine

qasr_travel:
  csv_column: "Auto Qasr mode"
  rqs: [RQ3]
  keywords:
    - qasr
    - qasar          # transliteration variant
    - kasr
    - travel
    - travelling
    - traveling
    - shorten
    - shortened
    - journey
    - musafir
    - musafer
    - safar
    - abroad
    - flight
    - trip
  regex_patterns:
    - "(?:shorten|shortened|shortening)\\s+(?:the\\s+)?(?:prayer|salah|namaz)"
    - "(?:when|while|during)\\s+(?:i\\s+am\\s+|i'?m\\s+)?travel"
    - "(?:qasr|qasar)\\s*(?:mode|prayer|option|setting)?"
    - "সফর|কসর"                   # Bengali: travel / qasr
  # Store copy says "spiritual journey" constantly; the review-side keywords
  # journey/travel/trip fired on 13 apps that have no qasr feature at all.
  # Require terms that only appear when the app genuinely claims qasr support.
  promise_keywords:
    - qasr
    - qasar
    - kasr
    - musafir
    - musafer
  promise_regex_patterns:
    - "shorten(?:ed|ing|s)?\\s+(?:the\\s+)?(?:prayer|salah|namaz)"
    - "(?:travel|journey)\\s+mode"
    - "auto[- ]?qasr"

calendar_sync:
  csv_column: "Connect to Google Calendar"
  rqs: [RQ6b]
  keywords:
