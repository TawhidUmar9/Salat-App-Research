    - adhan
    - athan          # transliteration variant
    - azaan
    - azan sound
    - notification
    - notifications
    - alarm
    - reminder
    - reminders
    - alert
    - sound
    - silent
    - ringtone
    - muezzin
    - late
    - vibrate
  regex_patterns:
    - "doesn'?t\\s+(?:ring|sound|play|go\\s+off|notify)"
    - "(?:no|not|never)\\s+(?:getting|receiving|any)\\s+notification"
    - "notification.{0,20}(?:not\\s+working|stopped|delayed|late)"
    - "আজান|আযান"                 # Bengali: adhan
    - "أذان"                      # Arabic: adhan

forbidden_times:
